<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ave com Crista — Cultura Jama-Coaque</title>

  <link rel="stylesheet" href="../style.css">

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>
</head>

<body>

  <main class="experiencia">

    <header class="cabecalho">
      <span>Museu do Equador</span>
      <h1>Ave com Crista</h1>
      <p>Cultura Jama-Coaque</p>
    </header>

    <div class="visualizador">

      <model-viewer
        src="../models/ave_con_cresta_jama_coaque.glb"
        alt="Ave com crista da cultura Jama-Coaque"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        ar
        ar-modes="webxr scene-viewer quick-look">

        <button
          class="ar-button"
          slot="ar-button">
          Ver em realidade aumentada
        </button>

      </model-viewer>

    </div>

    <p class="instrucao">
      Arraste para girar • Faça pinça para aproximar
    </p>

  </main>

</body>
</html>
